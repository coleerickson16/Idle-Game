<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Idle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="p-4">

    <div class="max-w-[1600px] mx-auto game-container">
        <!-- Compact Header -->
        <header class="text-center mb-3">
            <h1 class="text-3xl font-extrabold text-white">Adventure Idle</h1>
            <p class="text-sm text-gray-400">Level up your skills to unlock new content!</p>
        </header>

        <!-- Main Content Grid -->
        <main class="main-grid mb-3">

            <!-- 1. Skills Panel (Compact & Scrollable) -->
            <div class="bg-gray-700 p-3 rounded-xl shadow-lg flex flex-col">
                <h2 class="text-xl font-bold border-b border-gray-600 pb-2 mb-3 text-white">Skills</h2>
                <div id="skills-panel" class="space-y-2 flex-1 overflow-y-auto custom-scroll pr-1">
                    <!-- Skills will be injected here by JavaScript -->
                </div>
                <div class="mt-3 pt-3 border-t border-gray-600">
                    <h3 class="text-lg font-semibold text-white mb-1">Current Activity</h3>
                    <div id="activity-status" class="text-sm text-gray-300">
                        Idle. Ready for adventure!
                    </div>
                </div>
            </div>

            <!-- 2. Inventory/Equipment Panel (TABBED & Scrollable) -->
            <div class="bg-gray-700 p-3 rounded-xl shadow-lg flex flex-col">
                <h2 class="text-xl font-bold border-b border-gray-600 pb-2 mb-3 text-white">Loot & Gear</h2>

                <!-- Tabs -->
                <div class="flex border-b border-gray-600 mb-3">
                    <button id="tab-inventory" class="p-2 mr-4 font-semibold text-sm text-white border-b-2 border-green-500 transition-colors">Inventory</button>
                    <button id="tab-equipment" class="p-2 font-semibold text-sm text-gray-400 hover:text-white transition-colors">Equipment</button>
                </div>

                <!-- Inventory Content Container -->
                <div id="inventory-container" class="flex-1 overflow-y-auto custom-scroll pr-1">
                    <div id="inventory-panel" class="space-y-2">
                        <!-- Inventory items will be injected here by JavaScript -->
                    </div>
                </div>

                <!-- Equipment Content Container -->
                <div id="equipment-container" class="hidden flex-1 overflow-y-auto custom-scroll pr-1">
                    <div id="equipment-panel" class="grid grid-cols-2 gap-2">
                        <!-- Equipment slots will be injected here by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- 3. Actions Panel (Scrollable) -->
            <div class="bg-gray-700 p-3 rounded-xl shadow-lg flex flex-col col-span-2">
                <!-- World Map Section -->
                <div id="world-map" class="mb-3 p-3 bg-gray-800 rounded-lg">
                    <!-- Map will be rendered here by JavaScript -->
                </div>

                <h2 class="text-xl font-bold border-b border-gray-600 pb-2 mb-3 text-white">Available Actions</h2>

                <!-- Scrollable Actions Container -->
                <div class="flex-1 overflow-y-auto custom-scroll pr-1">
                    <div class="space-y-3">
                        <!-- Collapsible Action Sections (One per Skill) -->
                        <!-- Woodcutting Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-yellow-500 hover:bg-gray-500 transition-colors duration-150">
                                Woodcutting
                            </summary>
                            <div id="woodcutting-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Woodcutting actions here -->
                            </div>
                        </details>

                        <!-- Mining Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-yellow-500 hover:bg-gray-500 transition-colors duration-150">
                                Mining
                            </summary>
                            <div id="mining-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Mining actions here -->
                            </div>
                        </details>

                        <!-- Fishing Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-cyan-500 hover:bg-gray-500 transition-colors duration-150">
                                Fishing
                            </summary>
                            <div id="fishing-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Fishing actions here -->
                            </div>
                        </details>

                        <!-- Firemaking Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-red-500 hover:bg-gray-500 transition-colors duration-150">
                                Firemaking
                            </summary>
                            <div id="firemaking-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Firemaking actions here -->
                            </div>
                        </details>

                        <!-- Smithing Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-blue-500 hover:bg-gray-500 transition-colors duration-150">
                                Smithing
                            </summary>
                            <div id="smithing-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Smithing actions here -->
                            </div>
                        </details>

                        <!-- Fletching Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-blue-500 hover:bg-gray-500 transition-colors duration-150">
                                Fletching
                            </summary>
                            <div id="fletching-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Fletching actions here -->
                            </div>
                        </details>

                        <!-- Cooking Actions -->
                        <details class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-orange-500 hover:bg-gray-500 transition-colors duration-150">
                                Cooking
                            </summary>
                            <div id="cooking-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Cooking actions here -->
                            </div>
                        </details>

                        <!-- Combat Actions -->
                        <details open class="bg-gray-600 rounded-xl shadow overflow-hidden">
                            <summary class="cursor-pointer p-2 text-sm font-semibold text-white border-l-4 border-red-500 hover:bg-gray-500 transition-colors duration-150">
                                Combat
                            </summary>
                            <div id="combat-actions" class="grid grid-cols-1 gap-2 p-2">
                                <!-- Combat actions here -->
                            </div>
                        </details>
                    </div>
                </div>

                <!-- Dedicated Stop Container: Always visible at bottom -->
                <div id="stop-action-container" class="mt-3">
                    <!-- Stop button injected here -->
                </div>
            </div>

        </main>

        <!-- 4. Message Log (Fixed at bottom) -->
        <div class="bg-gray-900 p-3 rounded-xl shadow-inner">
            <h2 class="text-lg font-bold text-gray-200 border-b border-gray-700 pb-2 mb-2">Game Log</h2>
            <div id="log" class="h-32 overflow-y-auto text-sm text-gray-400 space-y-1 custom-scroll">
                <!-- Log messages will be injected here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Load game modules -->
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
